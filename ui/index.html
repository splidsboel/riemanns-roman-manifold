<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>riemanns-roman-manifold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="canvas-local"></canvas>

  <!-- Crosshair (always visible at screen center) -->
  <div id="crosshair">
    <div class="ch-dot"></div>
    <div id="crosshair-label"></div>
  </div>

  <!-- Semantic search (bottom-left, chat-like box) -->
  <div id="search-panel" class="panel">
    <div class="panel-label">SEMANTIC SEARCH</div>
    <textarea id="search-input" rows="4" placeholder="type a query…  (enter to send · shift+enter for newline)" autocomplete="off" spellcheck="false"></textarea>
    <div id="hover-label"></div>
    <div id="search-status"></div>
  </div>

  <!-- Global world (bottom-right) -->
  <div id="global-panel">
    <canvas id="canvas-global"></canvas>
    <div id="global-label" class="panel-label">NEIGHBORHOOD</div>
  </div>

  <!-- Theme + local + settings toggles (top-right) -->
  <button id="local-toggle" title="Local exploration mode">[ local: off ]</button>
  <button id="theme-toggle" title="Toggle dark mode">[ dark ]</button>
  <button id="settings-toggle" title="Settings">[ * ]</button>
  <div id="settings-panel" class="panel hidden">
    <div class="panel-label">SETTINGS</div>
    <div class="srow">
      <label>CLUSTER DENSITY <span id="val-density">0.3</span></label>
      <input type="range" id="sld-density" min="0.05" max="20" step="0.05" value="0.3">
    </div>
    <div class="srow">
      <label>POINT SIZE <span id="val-pts">0.3</span></label>
      <input type="range" id="sld-pts" min="0.1" max="5" step="0.1" value="0.3">
    </div>
    <div class="srow">
      <label>MOVE SPEED <span id="val-spd">7.0</span></label>
      <input type="range" id="sld-spd" min="0.1" max="10" step="0.1" value="7.0">
    </div>
    <div class="srow">
      <label>GLIDE <span id="val-glide">0.0</span></label>
      <input type="range" id="sld-glide" min="0" max="1" step="0.05" value="0">
    </div>
    <div class="srow">
      <label>FOG <span id="val-fog">1.0</span></label>
      <input type="range" id="sld-fog" min="0" max="1" step="0.05" value="1">
    </div>
  </div>

  <!-- HUD (bottom-left below search) -->
  <div id="hud">
    [ click ] capture &middot; [ wasd / arrows ] move &middot; [ space / shift ] up / down &middot; [ esc ] release
  </div>

  <!-- Loading overlay -->
  <div id="overlay">
    <div class="loader">[ loading ]</div>
    <div id="overlay-msg">initializing manifold…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.min.js"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
