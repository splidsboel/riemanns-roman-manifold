<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ragrats Vector Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0e27;
            color: #e4e4e7;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #info-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 300px;
            background: rgba(20, 24, 50, 0.95);
            border-top: 1px solid rgba(124, 58, 255, 0.2);
            padding: 20px;
            overflow-y: auto;
            display: none;
            z-index: 10;
        }

        #info-panel.visible {
            display: block;
        }

        #info-panel h3 {
            color: #a78bfa;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #info-panel p {
            color: #a1a1aa;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        #info-panel .vessel {
            color: #60a5fa;
            font-weight: 600;
        }

        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 24, 50, 0.9);
            border: 1px solid rgba(124, 58, 255, 0.2);
            border-radius: 8px;
            padding: 16px;
            font-size: 12px;
            color: #a1a1aa;
            z-index: 10;
            max-width: 280px;
        }

        #controls h4 {
            color: #a78bfa;
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
        }

        .control-item {
            margin: 6px 0;
            line-height: 1.4;
        }

        #status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 24, 50, 0.9);
            border: 1px solid rgba(124, 58, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 12px;
            z-index: 10;
        }

        .stat-value {
            color: #60a5fa;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="controls">
        <h4>Navigation</h4>
        <div class="control-item">🖱️ Drag to rotate</div>
        <div class="control-item">🔍 Scroll to zoom</div>
        <div class="control-item">Click point to view</div>
    </div>

    <div id="status">
        <div>Points: <span class="stat-value" id="point-count">0</span></div>
    </div>

    <div id="info-panel">
        <h3 id="info-vessel">Vessel</h3>
        <p id="info-text"></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
